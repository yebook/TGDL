# Explicit source build: docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  app:
    image: ${TGD_APP_IMAGE:-tgd-app:0.1.0}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
  bot-api:
    image: ${TGD_API_IMAGE:-tgd-bot-api:0.1.0}
    pull_policy: never
    build: &api-build
      context: .
      dockerfile: deploy/bot-api/Dockerfile
      args:
        TGD_BUILD_JOBS: ${TGD_BUILD_JOBS:-2}
        TGD_NATIVE_IMAGE: ${TGD_NATIVE_IMAGE:-native}
  init-volumes:
    image: ${TGD_API_IMAGE:-tgd-bot-api:0.1.0}
    pull_policy: never
    build: *api-build
