name: Publish production images

on:
  workflow_dispatch:
    inputs:
      publish_numeric_version:
        description: Also publish the current numeric version (existing tags are never overwritten)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets; create public tgdl-app and tgdl-bot-api repositories."
            exit 1
          fi
      - name: Install digest-preserving registry copy tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify bundled native binary and publish the production pair
        env:
          PUBLISH_NUMERIC_VERSION: ${{ inputs.publish_numeric_version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          args=()
          if [[ "$PUBLISH_NUMERIC_VERSION" == "true" ]]; then args+=(--release); fi
          python scripts/publish_images.py "${args[@]}"
      - name: Upload digest-pinned deployment files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tgdl-deployment-amd64-${{ github.sha }}
          path: deployment-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
